{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" type="text/css" href="{% static 'drf-yasg/swagger-ui-dist/swagger-ui.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'drf-yasg/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'css/swagger-theme.css' %}">
    {% if favicon_url %}
    <link rel="icon" type="image/png" href="{{ favicon_url }}" sizes="32x32" />
    <link rel="icon" type="image/png" href="{{ favicon_url }}" sizes="16x16" />
    {% endif %}
</head>
<body class="swagger-section">
    <div id="swagger-ui"></div>
    <script src="{% static 'drf-yasg/swagger-ui-dist/swagger-ui-bundle.js' %}"></script>
    <script src="{% static 'drf-yasg/swagger-ui-dist/swagger-ui-standalone-preset.js' %}"></script>
    <script src="{% static 'drf-yasg/insignia.js' %}"></script>
    <script id="swagger-settings" type="application/json">
        {{ swagger_settings|safe }}
    </script>
    <script id="oauth2-config" type="application/json">
        {{ oauth2_config|safe }}
    </script>
    <script src="{% static 'drf-yasg/swagger-ui-init.js' %}"></script>
</body>
</html>
